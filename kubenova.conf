# ╔══════════════════════════════════════════════════════════════════════════╗
# ║             KubeNova — Kubernetes Deployment Configuration             ║
# ║                                                                        ║
# ║  Edit this file, then run:  ./deploy.sh                                ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1 — CLUSTER ACCESS  (required)
# ─────────────────────────────────────────────────────────────────────────────

# Path to your kubeconfig file.
# Supports ~ expansion (e.g. ~/.kube/config).
KUBECONFIG_PATH="$HOME/.kube/config"

# (Optional) Specific kubeconfig context to use.
# Leave empty to use the current-context in your kubeconfig.
# Example: "arn:aws:eks:us-east-1:123456789:cluster/my-cluster"
KUBE_CONTEXT=""


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2 — DOCKER IMAGE REGISTRY
# ─────────────────────────────────────────────────────────────────────────────

# Container registry where the built images will be pushed.
#
#   Remote cluster (EKS / GKE / AKS / etc.)
#     Set REGISTRY to a registry the cluster can pull from:
#       REGISTRY="ghcr.io/yourorg"
#       REGISTRY="123456789.dkr.ecr.us-east-1.amazonaws.com/kubenova"
#       REGISTRY="gcr.io/my-project"
#
#   Local cluster (kind / k3d / minikube)
#     Leave REGISTRY empty — images are loaded directly into the cluster
#     without needing a registry (uses kind/k3d/minikube CLI tooling).
#       REGISTRY=""
#
REGISTRY=""

# Tag applied to the built images (e.g. "latest", "v1.2.0", "$(git rev-parse --short HEAD)")
IMAGE_TAG="latest"


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3 — LLM PROVIDER  (pick ONE block, comment out the others)
# ─────────────────────────────────────────────────────────────────────────────

# ── Option A: Anthropic Claude ───────────────────────────────────────────────
LLM_PROVIDER="anthropic"
LLM_MODEL="claude-3-5-haiku-20241022"    # fast & cheap; use claude-sonnet-4-6 for best quality
LLM_API_KEY=""                           # sk-ant-api... — required
LLM_BASE_URL=""                          # leave empty for Anthropic

# ── Option B: OpenAI / OpenAI-compatible (e.g. Gemini via OpenAI endpoint) ──
# LLM_PROVIDER="openai"
# LLM_MODEL="gpt-4o-mini"
# LLM_API_KEY=""                         # sk-...
# LLM_BASE_URL=""                        # leave empty for OpenAI
#                                        # for Gemini: https://generativelanguage.googleapis.com/v1beta/openai/

# ── Option C: Ollama (free, self-hosted, runs INSIDE the cluster pod) ────────
# Note: Ollama itself is NOT deployed by this script.
# You must run Ollama separately and point LLM_BASE_URL at it.
# LLM_PROVIDER="ollama"
# LLM_MODEL="llama3.2"
# LLM_API_KEY=""                         # not needed for Ollama
# LLM_BASE_URL="http://ollama.ollama.svc.cluster.local:11434"


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4 — NAMESPACE & SCALING
# ─────────────────────────────────────────────────────────────────────────────

# Kubernetes namespace to deploy KubeNova into (created if it doesn't exist).
NAMESPACE="kubenova"

# Number of backend replicas.
# The LangGraph agent is stateless per-request; 1 is fine for most use cases.
BACKEND_REPLICAS=1

# Number of frontend replicas.
FRONTEND_REPLICAS=1


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5 — EXTERNAL ACCESS
# ─────────────────────────────────────────────────────────────────────────────

# How to expose KubeNova to users outside the cluster.
#
#   LoadBalancer — (recommended for cloud clusters)
#     Provisions a cloud load balancer with an external IP automatically.
#     Works on EKS, GKE, AKS, and most managed Kubernetes services.
#
#   NodePort — (recommended for local/bare-metal clusters)
#     Exposes the app on a fixed port on every cluster node.
#     Access via: http://<any-node-ip>:<NODEPORT>
#
EXPOSE_TYPE="LoadBalancer"

# Port to use when EXPOSE_TYPE=NodePort (must be 30000–32767).
NODEPORT="30080"


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 6 — DATABASE  (optional override)
# ─────────────────────────────────────────────────────────────────────────────

# SQLite (default) — simple but data is lost when the backend pod restarts.
DATABASE_URL="sqlite+aiosqlite:///./kubenova.db"

# PostgreSQL — recommended for production persistence.
# Uncomment and fill in your connection string:
# DATABASE_URL="postgresql+asyncpg://user:password@postgres-host:5432/kubenova"


# ─────────────────────────────────────────────────────────────────────────────
# SECTION 7 — ADVANCED  (optional, safe to leave as-is)
# ─────────────────────────────────────────────────────────────────────────────

# Runtime environment label (controls log verbosity and CORS strictness).
KUBENOVA_ENV="production"

# CORS origins the backend will accept.
# Defaults to "*" which allows all origins — fine for internal cluster use.
# Restrict to your domain in production, e.g.: '["https://kubenova.mycompany.com"]'
CORS_ORIGINS='["*"]'
