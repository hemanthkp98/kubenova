# nginx configuration for KubeNova frontend container.
# Proxies /api/* to the backend, serves the SPA for everything else.
# WebSocket connections (chat stream, log stream) are handled by the /api/ block.

# Map $http_upgrade to Connection header:
#   - WebSocket requests  → "upgrade"
#   - Regular HTTP         → "" (nginx uses keep-alive by default)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy all /api/ traffic to the backend — REST and WebSocket alike.
    # WebSocket paths: /api/chat/ws/chat  /api/logs/ws/<pod>
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Serve the React SPA; unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
