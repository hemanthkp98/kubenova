apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubenova.fullname" . }}-backend
  labels:
    {{- include "kubenova.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kubenova.backendSelectorLabels" . | nindent 4 }}
