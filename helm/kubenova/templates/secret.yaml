{{- if and .Values.llm.apiKeySecret (not (lookup "v1" "Secret" .Release.Namespace .Values.llm.apiKeySecret)) }}
# NOTE: This template creates a placeholder Secret.
# Populate it with your real LLM API key:
#   kubectl create secret generic kubenova-llm-key \
#     --from-literal=LLM_API_KEY=sk-your-key-here -n {{ .Release.Namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.apiKeySecret }}
  labels:
    {{- include "kubenova.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Base64-encoded placeholder — replace with real key.
  LLM_API_KEY: ""
{{- end }}
