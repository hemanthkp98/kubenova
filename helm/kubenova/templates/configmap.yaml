apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubenova.fullname" . }}-config
  labels:
    {{- include "kubenova.labels" . | nindent 4 }}
data:
  KUBENOVA_ENV: {{ .Values.backend.env.KUBENOVA_ENV | quote }}
  KUBENOVA_LOG_LEVEL: {{ .Values.backend.env.KUBENOVA_LOG_LEVEL | quote }}
  KUBENOVA_DATABASE_URL: {{ .Values.database.url | quote }}
  MAX_LOG_LINES: {{ .Values.backend.env.MAX_LOG_LINES | quote }}
  AUDIT_PAGE_SIZE: {{ .Values.backend.env.AUDIT_PAGE_SIZE | quote }}
  {{- if .Values.defaultNamespace }}
  DEFAULT_CLUSTER_CONTEXT: {{ .Values.defaultNamespace | quote }}
  {{- end }}
