# KubeNova — development override (hot-reload)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#        or simply: make dev

services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app:cached
      # kubeconfig is inherited from docker-compose.yml (~/.kube auto-mount).
      # To use a k3d/Colima kubeconfig: set KUBECONFIG_DIR in .env, e.g.:
      #   KUBECONFIG_DIR=/path/to/.kube   (must contain a 'config' file)
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      KUBENOVA_ENV: development
      KUBENOVA_LOG_LEVEL: DEBUG

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
